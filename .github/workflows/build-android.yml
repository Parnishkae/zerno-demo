name: Build Android APK (Meridian)

# Собирает нативный .apk из веб-части (finance/) — скачивается из Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [claude/finance-app-plan-sf9aou]
    paths:
      - 'android/**'
      - 'finance/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle web app into the APK
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          cp finance/index.html finance/manifest.webmanifest finance/sw.js android/app/src/main/assets/
          cp finance/icon-*.png android/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp finance/icon-192.png "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "Bundled assets:" && ls android/app/src/main/assets

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Meridian.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-Android
          path: Meridian.apk
          if-no-files-found: error
